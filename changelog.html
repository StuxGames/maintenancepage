<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stux.games/icon.png">
    <meta name="description" content="Everything that's changed on this Stux.Games placeholder page, release by release.">
    <title>Changelog — Stux.Games</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --font-sans: 'Oxanium', system-ui, -apple-system, sans-serif;
            --font-display: 'Oxanium', system-ui, -apple-system, sans-serif;
        }
        [data-theme="dark"] { --accent: #FFBA1A; --accent-bright: #FFCB52;
            --bg: #0E0B04; --bg-card: #1B1608; --border: rgba(255,186,26,0.09); --border-mid: rgba(255,186,26,0.18);
            --text: #F5EFDF; --text-muted: #A8956A; --badge-bg: rgba(255,186,26,0.12); --badge-border: rgba(255,186,26,0.22);
        }
        [data-theme="light"] { --accent: #855D00; --accent-bright: #A87800;
            --bg: #FBF8EF; --bg-card: #FFFFFF; --border: rgba(133,93,0,0.12); --border-mid: rgba(133,93,0,0.25);
            --text: #261C04; --text-muted: #6A5730; --badge-bg: rgba(133,93,0,0.10); --badge-border: rgba(133,93,0,0.20);
        }

        html, body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100%; transition: background 0.3s, color 0.3s; }
        a, a:visited { color: var(--accent); text-decoration: none; }
        a:hover, a:focus { opacity: 0.8; }

        .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 6%; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; color: var(--text); font-family: var(--font-display); }
        .brand img { height: 32px; width: auto; }
        #theme-toggle {
            background: var(--badge-bg); border: 1px solid var(--badge-border); border-radius: 50%;
            width: 38px; height: 38px; font-size: 17px; line-height: 38px; text-align: center; cursor: pointer; padding: 0; color: var(--accent);
        }
        #theme-toggle:hover { opacity: 0.85; }

        main { max-width: 780px; margin: 0 auto; padding: 10px 6% 60px; }
        h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 10px 0 6px; }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; margin: 0 0 32px; line-height: 1.6; }

        .changelog-entry { padding: 20px 22px; margin: 0 0 16px; border: 1px solid var(--border); border-radius: 18px; background: var(--bg-card); }
        .changelog-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
        .changelog-version { margin: 0; font-size: 1.15rem; color: var(--text); font-weight: 600; font-family: var(--font-display); }

        .changelog-label-row { margin: 14px 0 8px; }
        .changelog-label-row:first-of-type { margin-top: 0; }
        .changelog-label {
            display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 3px 9px; border-radius: 5px;
            color: var(--cl); background: color-mix(in srgb, var(--cl) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--cl) 45%, transparent);
        }
        /* Fixed type palette & order: Added, Changed, Fixed, Removed, Security, Deprecated */
        .changelog-label-added      { --cl: #2ecc71; }
        .changelog-label-changed    { --cl: #3ba7ff; }
        .changelog-label-fixed      { --cl: #ffa64d; }
        .changelog-label-removed    { --cl: #ff4d4d; }
        .changelog-label-security   { --cl: #b06bff; }
        .changelog-label-deprecated { --cl: #8a8a94; }
        [data-theme="light"] .changelog-label-added      { --cl: #1e8449; }
        [data-theme="light"] .changelog-label-changed    { --cl: #1a6fc0; }
        [data-theme="light"] .changelog-label-fixed      { --cl: #b8650f; }
        [data-theme="light"] .changelog-label-removed    { --cl: #c62828; }
        [data-theme="light"] .changelog-label-security   { --cl: #7b3fc4; }
        [data-theme="light"] .changelog-label-deprecated { --cl: #5f5f68; }

        .changelog-list { margin: 0 0 4px; padding-left: 20px; color: var(--text-muted); font-size: 0.92rem; line-height: 1.65; }
        .changelog-list li { margin: 0 0 4px; }
        .changelog-list code { background: var(--badge-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
        .changelog-p { color: var(--text-muted); font-size: 0.92rem; }

        footer { text-align: center; padding: 20px 6% 40px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 20px; }
        footer a, footer a:visited { color: var(--text-muted); font-weight: 400; }
        footer a:hover { opacity: 0.8; }
        .copy-glyph { display: inline-block; vertical-align: -1px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
            [data-theme="dark"] .for-light, [data-theme="light"] .for-dark { display: none; }
        .site-banners { --banner-page-bg: var(--bg); --banner-text: var(--text); --banner-site: #FFBA1A; --banner-site-light: #855D00; }
    </style>
    <link rel="stylesheet" href="/assets/site-banner.css">
</head>
<body>

<header class="site-header">
    <a class="brand" href="./"><img class="for-light" src="https://global.media.stux.games/icon.png" alt="Stux.Games"><img class="for-dark" src="https://global.media.stux.games/icon-light.png" alt="">
        <span>Stux.Games</span></a>
    <button type="button" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9788;</button>
</header>

<main>
    <h1>Changelog</h1>
    <p class="subtitle">Everything that's changed on this maintenance holding page, release by release.</p>

    <div id="changelog-body">
        <p class="changelog-p">Loading changelog&hellip;</p>
    </div>
</main>

<footer>
    <p>Stux.Games is operated by Stux Group Ltd. <svg class="copy-glyph" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><title>Copyright</title><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.2 6.3A2.6 2.6 0 1 0 10.2 9.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="sr-only">Copyright</span> <span data-copyright-years data-start="2026">2026</span> Stux.Group. All rights reserved.</p>
</footer>

<script>
    (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var stored = localStorage.getItem('stuxgames-theme');
        var isDark = stored ? stored === 'dark' : prefersDark;

        function apply(dark) {
            root.setAttribute('data-theme', dark ? 'dark' : 'light');
            btn.textContent = dark ? '☀' : '☾';
            btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        }

        apply(isDark);

        btn.addEventListener('click', function () {
            isDark = !isDark;
            localStorage.setItem('stuxgames-theme', isDark ? 'dark' : 'light');
            apply(isDark);
        });
    })();
</script>
<script>
    (function () {
        var target = document.getElementById('changelog-body');
        var CATEGORIES = ['Added', 'Changed', 'Fixed', 'Removed', 'Security', 'Deprecated'];

        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function inline(s) {
            s = esc(s);
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return s;
        }
        // Reorder each release's "### <Category>" blocks into CATEGORIES order,
        // regardless of the order CHANGELOG.md lists them in. Unknown H3s go last
        // (in source order); lines before a release's first H3 stay put.
        function sortSections(lines) {
            var out = [], blocks = [];
            var rankPattern = new RegExp('^(' + CATEGORIES.join('|') + ')\\b');
            function flush() {
                blocks.forEach(function (b, i) { b.i = i; });
                blocks.sort(function (a, b) { return (a.rank - b.rank) || (a.i - b.i); });
                blocks.forEach(function (b) { out.push.apply(out, b.lines); });
                blocks = [];
            }
            lines.forEach(function (line) {
                var m;
                if (/^#{1,2}\s/.test(line) || line.trim() === '---') {
                    flush(); out.push(line);
                } else if ((m = line.match(/^###\s+(.+)$/))) {
                    var cm = m[1].trim().match(rankPattern);
                    blocks.push({ rank: cm ? CATEGORIES.indexOf(cm[1]) : CATEGORIES.length, lines: [line] });
                } else if (blocks.length) {
                    blocks[blocks.length - 1].lines.push(line);
                } else {
                    out.push(line);
                }
            });
            flush();
            return out;
        }
        function renderChangelog(md) {
            var lines = sortSections(md.replace(/\r\n/g, '\n').trim().split('\n'));
            var html = '';
            var inEntry = false;
            var inList = false;
            var itemBuf = null;
            var catPattern = new RegExp('^(' + CATEGORIES.join('|') + ')\\b\\s*(.*)$');

            function flushItem() { if (itemBuf !== null) { html += '<li>' + inline(itemBuf) + '</li>\n'; itemBuf = null; } }
            function flushList() { flushItem(); if (inList) { html += '</ul>\n'; inList = false; } }
            function flushEntry() { flushList(); if (inEntry) { html += '</div>\n'; inEntry = false; } }

            lines.forEach(function (raw) {
                var line = raw.replace(/\s+$/, '');
                if (line.trim() === '') { flushItem(); return; }

                var m = line.match(/^##\s+(.+)$/);
                if (m) {
                    flushEntry();
                    html += '<div class="changelog-entry"><div class="changelog-entry-head"><h3 class="changelog-version">' + esc(m[1].trim()) + '</h3></div>\n';
                    inEntry = true;
                    return;
                }

                m = line.match(/^###\s+(.+)$/);
                if (m) {
                    flushList();
                    var text = m[1].trim();
                    var cm = text.match(catPattern);
                    if (cm) {
                        html += '<div class="changelog-label-row"><span class="changelog-label changelog-label-' + cm[1].toLowerCase() + '">' + cm[1] + '</span></div>\n';
                    } else {
                        html += '<h4 class="changelog-section">' + esc(text) + '</h4>\n';
                    }
                    return;
                }

                m = line.match(/^-\s+(.+)$/);
                if (m) {
                    flushItem();
                    if (!inList) { html += '<ul class="changelog-list">\n'; inList = true; }
                    itemBuf = m[1].trim();
                    return;
                }

                if (/^#\s+/.test(line)) { flushItem(); return; }

                if (inList && itemBuf !== null) {
                    itemBuf += ' ' + line.trim();
                }
            });

            flushEntry();
            target.innerHTML = html || '<p class="changelog-p">No changelog entries yet.</p>';
        }

        fetch('CHANGELOG.md')
            .then(function (r) {
                if (!r.ok) throw new Error('fetch failed');
                return r.text();
            })
            .then(renderChangelog)
            .catch(function () {
                target.innerHTML = '<p class="changelog-p">Couldn’t load the changelog right now &mdash; see <a href="https://github.com/StuxGames/maintenancepage/blob/main/CHANGELOG.md">CHANGELOG.md</a> on GitHub instead.</p>';
            });
    })();
</script>
<script>(function(){var y=new Date().getFullYear();document.querySelectorAll('[data-copyright-years]').forEach(function(e){var s=parseInt(e.getAttribute('data-start'),10);e.textContent=s>=y?String(y):s+'–'+y;});})();</script>
    <script src="/assets/dev-mode.js"></script>
    <script src="/assets/site-banners.js"></script>
    <script src="/assets/site-banner.js"></script>
</body>
</html>
